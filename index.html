!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Territórios - v. 8.2</title>
    <!-- == Script t28k.html enviado github tem todos os territórios e vertices novos com login, colorido == -->
    <!-- Leaflet CSS - Biblioteca para mapas interativos -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>
    
    <!-- Firebase v8 (Compat) - Para salvar dados na nuvem -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link rel="icon" href="https://example.com/path/to/your/favicon.ico" type="image/x-icon">

    <!-- Arquivo de configuração externo (não expõe a API key)     -->
    <script src="config.js"></script>          
    
    <style>
        /* ===== ESTILOS GERAIS == body  color: #e0e0e0; === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /*background-color: #f0f2f5;   #1a1a2e; '#B0E0E6' #471691 roxo*/
            background: #471691;
            color: #394151;
            overflow: hidden;
        }
        
        /* ===== TELA DE LOGIN ===== */
        #loginScreen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            z-index: 10000;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        #loginScreen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 40px 35px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
        }

        .login-box h1 {
            font-size: 22px;
            color: #4facfe;
            margin-bottom: 8px;
        }

        .login-box .subtitle {
            font-size: 13px;
            color: #a0aec0;
            margin-bottom: 28px;
        }

        .login-icon {
            font-size: 56px;
            margin-bottom: 16px;
            display: block;
        }

        .login-input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 14px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.25);
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .login-input::placeholder {
            color: #8892b0;
        }

        .login-input:focus {
            border-color: #4facfe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.2);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(79, 172, 254, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-error {
            color: #ff6b6b;
            font-size: 13px;
            margin-top: 12px;
            min-height: 18px;
        }
        
        /* ===== CONTAINER PRINCIPAL ===== */
        #appContainer {
            display: none;
            flex-direction: column;
        }
        
        #appContainer.active {
            display: flex;
        }
        
        /* ===== CABEÇALHO  BARRA SUPERIOR===== */
        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            z-index: 1000;
            flex-shrink: 0;
        }
        
        .header h1 {
            font-size: 16px;
            color: #4facfe;
        }
        /* Barra superior */
        .top-bar {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 16px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            z-index: 1000;
            flex-shrink: 0;
        }

        .top-bar-header {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 200px;
        }

        .top-bar-header h1 {
            font-size: 16px;
            color: #163cd6;
            white-space: nowrap;
        }
        
        .top-bar-header h2 {
            font-size: 16px;
            color: #163cd6;
            white-space: nowrap;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #userBadge {
            background: #667eea;
            color: #4facfe;
            /*color: white;*/
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
        }
    
        /*  sync-indicator= indicador de sincronização */
        .sync-indicator {
            position: fixed;
            top: 70px;
            right: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 15px;
            font-weight: 800;
            z-index: 2000;
            transition: all 0.3s;
        }
        
        .sync-indicator.online {
            background: #d4edda;
            color: #38ef7d;
            border: 1px solid rgba(17, 153, 142, 0.3);
        }
        
        .sync-indicator.offline {
            background: rgba(79, 172, 254, 0.2);
            /*background: #f8d7da; color: #27070a;  */
            color: #ff6b6b;
        }
        
        .sync-indicator.syncing {
            background: rgba(79, 172, 254, 0.2);
            color: #4facfe;
            border: 1px solid rgba(79, 172, 254, 0.3);
        }

        /* Controles de território */
        .territory-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .territory-controls label {
            font-size: 2px;
            color: #1865c9;
            white-space: nowrap;
        }

        .territory-input-wrapper {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .territory-input {
            width: 56px;
            height: 32px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            outline: none;
        }

        .territory-input:focus {
            border-color: #4facfe;
            box-shadow: 0 0 0 2px rgba(79, 172, 254, 0.2);
        }

        /* Configuração do estilo dos marcadores para inserir letras nas quadras */
        .letter-icon {
            background-color: rgba(255, 255, 255, 0.8);
            border: 1px solid #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }
        /* Remove fundo padrão do Leaflet para o marcador de letra */
        .letter-marker {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }
        /* Garante que o texto apareça acima de outros elementos */
        .leaflet-zoom-animated {
            z-index: 600;
        }

        /* ===== CONTROLES =são os 4 controles principais==== */
        .controls {
            /*background: #96c0ea; 
            padding: 15px 20px;  */
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            /*border-bottom: 1px solid #ddd; */
        }
        
        .controls input[type="number"] {
            padding: 8px 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            width: 80px;
            font-size: 16px;
        }
        
        .controls button {
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .user-badge {
            background: rgba(79, 172, 254, 0.05);
            color: #4facfe;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .btn {
            padding: 8px 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.08);
            color: #e0e0e0;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        
        .btn:hover {
            background: #5568d3;
            border-color: rgba(255, 255, 255, 0.3);
        }
        
        .btn-zoom {
            padding: 8px 10px;
            font-size: 14px;
        }

        .btn-blue {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            border: none;
            color: #fff;
        }

        .btn-blue:hover {
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
        }

        .btn-mark-all {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            border: none;
            color: #fff;
        }

        .btn-unmark-all {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            border: none;
            color: #fff;
        }

        .btn-reset {
            background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
            border: none;
            color: #fff;
        }

        .btn-arrow {
            width: 32px;
            height: 32px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.08);
            color: #e0e0e0;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-arrow:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-arrow:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .btn-action {
            padding: 7px 14px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }
        
        /* ===== MAPA ===== height: calc(100vh - 180px); */
        #map {
            height: 100vh;
            width: 100%;
        }

        /* ===== RÓTULOS DAS QUADRAS   */
        .quadra-label {
            font-size: 12px;
            font-weight: 900;
            fill: #765cf8f2;
            text-anchor: middle;
            dominant-baseline: middle;
            pointer-events: none;
            text-shadow: 1px 1px 3px white
        }
        
        /* ===== NÚMEROS DOS TERRITÓRIOS (25px, azul marinho, sem sombra) ===== */
        .territory-number-marker {
            background: transparent;
            border: none;
        }
        
        .territory-number {
            font-size: 25px;
            font-weight: bold;
            color: #000080; /* Azul marinho */
            text-shadow: none; /* Sem sombras */
            text-align: center;
            line-height: 1;
            font-family: Arial, sans-serif;
        }
        
        /* ===== VÉRTICES ===== */
        .vertex {
            cursor: pointer;
        }
        
        .vertex.selected {
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }
        
        .modal-overlay.active {
            display: flex;
        }
        
        .modal {
            background: white;
            border-radius: 10px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .modal-header {
            padding: 20px;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-title {
            font-size: 18px;
            color: #333;
        }
        
        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }
        
        .modal-close:hover {
            color: #333;
        }
        
        .modal-body {
            padding: 20px;
        }
        
        .faces-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        
        .face-btn {
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
        }
        
        .face-btn:hover {
            border-color: #667eea;
        }
        
        .face-btn.marked {
            background: #d4edda;
            border-color: #27ae60;
        }
        
        .face-indicator {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid #999;
            flex-shrink: 0;
        }
        
        .face-btn.marked .face-indicator {
            background: #27ae60;
            border-color: #27ae60;
        }
        
        /* ===== PAINEL DE STATUS ===== */
        .status-panel {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: white;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            transition: transform 0.3s;
            z-index: 9998;
        }
        
        .status-panel.visible {
            transform: translateX(-50%) translateY(0);
        }
        
        /*  =========================
            RESPONSIVO
            ========================= */
        @media (max-width: 768px) {
            .top-bar {
                padding: 8px 10px;
                gap: 6px;
            }

            .top-bar-header h1 {
                font-size: 14px;
            }

            .btn {
                padding: 6px 10px;
                font-size: 12px;
            }

            .territory-controls label {
                font-size: 12px;
                color: #1865c9;
            }

            .modal-content {
                padding: 16px;
                max-width: 320px;
            }

            .faces-grid {
                grid-template-columns: 1fr;
            }

            .face-btn {
                padding: 10px 12px;
                font-size: 13px;
            }

            .vertex {
                r: 6;
            }

            .vertex:hover,
            .vertex.selected,
            .vertex.pending {
                r: 8;
            }
        }

        /* ===== LOADING ===== */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 99999;
        }
        
        .loading-overlay.active {
            display: flex;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            margin-top: 15px;
            color: #333;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <!-- ===== TELA DE LOGIN ===== -->
    <div id="loginScreen">
        <div class="login-box">
            <span class="login-icon">🗺️</span>
            <h1>Bem-vindo(a) ao aplicativo de territórios!</h1>
            <p class="subtitle">Sistema de Controle de Territórios v8.2</p>
            <input type="text" id="loginName" class="login-input" placeholder="Seu nome" autocomplete="off">
            <input type="password" id="loginPass" class="login-input" placeholder="Senha de acesso" autocomplete="off">
            <button class="login-btn" onclick="doLogin()">Entrar</button>
            <div class="login-error" id="loginError"></div>
        </div>
    </div>
    
    <!-- ===== APLICAÇÃO PRINCIPAL após titulo h1  -->
    <div id="appContainer">
        <!-- CABEÇALHO - Barra superior -->
        <div class="top-bar">
            <div class="top-bar-header">
                <h1>🗺️ Controle Territórios</h1>
                <span class="user-badge" id="userBadge">Usuário</span>
                <span class="sync-indicator offline" id="syncStatus">Offline</span>
            </div>
            <div class="controls">
                <button class="btn btn-zoom" onclick="zoomIn()" title="Aumentar zoom">🔍+</button>
                <button class="btn btn-zoom" onclick="zoomOut()" title="Diminuir zoom">🔍−</button>
                <button class="btn" onclick="resetView()" title="Centralizar">📍</button>
                <button class="btn btn-reset" onclick="resetMarks()" title="Limpar todas">🗑️</button>
                <!--<button class="btn" onclick="exportData()" title="Exportar">💾</button> -->
            </div>
            <div class="territory-controls">
                <label for="territoryInput">Território:</label>
                <div class="territory-input-wrapper">
                    <button class="btn-arrow" id="btnDecrement" onclick="changeTerritory(-1)"
                        title="Anterior">−</button>
                    <input type="number" id="territoryInput" class="territory-input" min="1" max="16" placeholder="Nº"
                        inputmode="numeric" onchange="validateTerritoryInput()" onkeyup="validateTerritoryInput()">
                    <button class="btn-arrow" id="btnIncrement" onclick="changeTerritory(1)" title="Próximo">+</button>
                </div>
                <button onclick="mostrarTerritorioNaTela()" class="btn-action btn-blue" title="Focar">🔍
                    Mostrar</button>
                <button onclick="markAllTerritoryEdges()" class="btn-action btn-mark-all" title="Marcar tudo">✅
                    Marcar</button>
                <button onclick="unmarkAllTerritoryEdges()" class="btn-action btn-unmark-all" title="Desmarcar tudo">❌
                    Desmarcar</button>
            </div>
          
        <!-- Mapa -->
        <div id="map"></div>
    
        <!-- ===== MODAL DE FACES ===== -->
        <div class="modal-overlay" id="modalOverlay">
            <div class="modal">
                <div class="modal-header">
                    <div>
                        <h2 class="modal-title" id="modalTitle">Quadra</h2>
                        <p style="color: #666; font-size: 14px;" id="modalSubtitle"></p>
                    </div>
                    <button class="modal-close" onclick="closeModal()">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="faces-grid" id="facesGrid"></div>
                </div>
            </div>
        </div>
     
        <!-- ===== LOADING ===== -->
        <div class="loading-overlay" id="loadingOverlay">
            <div>
                <div class="loading-spinner"></div>
                <div class="loading-text" id="loadingText">Carregando mapa...</div>
            </div>
        </div>
    </div>

    <!-- ===== PAINEL DE STATUS ===== -->
    <div class="status-panel" id="statusPanel">
        <span id="statusText"></span>
    </div>
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
    
    <script>

        // ===============================================
        // CONFIGURAÇÃO DO FIREBASE
        // ===============================================
        // Inicializa o Firebase com as configurações do config.js
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const dbRef = database.ref();
        console.log("✅ Firebase inicializado!");
        
        // =====================================================
        // LOGIN
        // =====================================================
        const LOGIN_PASSWORD = "t4"; // Senha fixa (em produção, usar autenticação real)
        let currentUser = null;
        
        // Função de login
        function doLogin() {
            const name = document.getElementById('loginName').value.trim();
            const pass = document.getElementById('loginPass').value;
            const errorEl = document.getElementById('loginError');
            
            // Validações
            if (!name) {
                errorEl.textContent = "Por favor, digite seu nome.";
                errorEl.style.display = 'block';
                return;
            }
            
            if (pass !== LOGIN_PASSWORD) {
                errorEl.textContent = "Senha incorreta. Tente novamente.";
                errorEl.style.display = 'block';
                document.getElementById('loginPass').value = '';
                return;
            }
            
            // Login bem-sucedido
            currentUser = name;
            document.getElementById('userBadge').textContent = name;
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('appContainer').classList.add('active');
            
            // Inicializa o app após login
            setTimeout(initApp, 500);
        }
        
        // Enter no LOGIN
        document.getElementById('loginPass').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') doLogin();
        });
        
        document.getElementById('loginName').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') document.getElementById('loginPass').focus();
        });
        
        // =====================================================
        // DEFINIÇÃO DE CORES DOS TERRITÓRIOS
        // =====================================================
        const COLORS = {
            azulClaro: '#87CEEB',      // Cor de T1 (território 1)
            verdeClaro: '#90EE90',     // Cor de T2 (território 2)
            rosa: '#FFB6C1',           // Cor de T3 (território 3)
            marromClaro: '#D2B48C',    // Cor de T4 (território 4)
            lilaz: '#d963dd',
            amarelo: '#F0E68C',
            azulEscuro: '#2b1691', 
            vermelho: '#EB6848',
            marromClaro: '#60580F',
            roxo: '#471691',
            azul: '#94edf9',
            rosa: '#F866F3',
            verde: '#2D9727',
            cinza: '#17515A',
            marrom: '#4F440c0b',
            // Cores padrão para territórios 5-16 (caso existam)
            padrao: ['#E6E6FA', '#F0E68C', '#FFE4B5', '#DDA0DD', '#60580F',
                     '#B0E0E6', '#FFB6C1', '#90EE90', '#87CEEB', '#d963dd']
        };

        // =====================================================
        // CONFIGURAÇÃO DO MAPA  [-23.540000, -46.508000]; // Centro inicial do mapa
        // =====================================================
        const MAP_CENTER = [-23.541077, -46.503974];
        const MAP_ZOOM = 17; // Nível de zoom inicial
        
        // =====================================================
        // ESTADO GLOBAL DA APLICAÇÃO
        // =====================================================
        let appState = {
            marks: {},              // Arestas marcadas (ex: {"T1_QA_E0": true})

        // =====================================================
        // INICIALIZAÇÃO DA APLICAÇÃO
        // =====================================================
        function initApp() {
            showLoading("Carregando mapa...");
            
            // Inicializa o mapa Leaflet

                zoomControl: false,
                attributionControl: true

            // Adiciona camada do OpenStreetMap
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
                maxZoom: 20,
                minZoom: 3
            }).addTo(appState.map);
            
            // Cria grupo para as camadas de overlay
            appState.overlayGroup = L.layerGroup().addTo(appState.map);
            
            // Configura listener do Firebase
            setupFirebaseListener();
            
            // Configura interações do mapa
            setupMapInteractions();
            
            // Restaura posição salva (se existir)
            restoreMapPosition();
            
            hideLoading();
            showStatus('✅ Atenção! Marque as arestas das quadras trabalhadas.');

            // PASSO 1: Criar pontos para colocar letra em quadras irregulares
            const letterPoints = {
                "C": [-23.542226, -46.506479],  //2C
                "B": [-23.541553, -46.510148],  //1B
                "C.": [-23.542586, -46.506158],  //6C
                "F": [-23.537886, -46.502285],  //3F
                "A": [-23.542055, -46.498647],  //13A
                "D": [-23.534866, -46.498700]   //5D
            };
            // ============================================
            // PASSO 2: Criar função para ícone customizado
            // ============================================
            function createLetterIcon(letter) {
                return L.divIcon({
                    className: 'letter-marker',  // Classe CSS para estilizar color: #ff0000 vermelho
                    html: `<div style="font-size: 12px; font-weight: bold; color: #27070a ; text-shadow: 1px 1px 2px white;">${letter}</div>`,
                    iconSize: [24, 24],          // Tamanho do marcador
                    iconAnchor: [12, 12]         // Ponto de âncora centralizado
                });
            };

            // ============================================
            // PASSO 3: Adicionar marcadores no mapa
            // ============================================
            Object.keys(letterPoints).forEach(function(letter) {
                var coords = letterPoints[letter];
                var marker = L.marker(coords, { 
                    icon: createLetterIcon(letter),
                    clickable: true  // Permite clicar se quiser adicionar eventos depois
                });
                
                // IMPORTANTE: Use appState.map (não "map") pois é assim que você declarou
                marker.addTo(appState.map);
            });

        // =====================================================
        // FIREBASE - LISTENER EM TEMPO REAL
        // =====================================================
        function setupFirebaseListener() {
            updateSyncStatus('syncing', 'Sincronizando...');
            
            // Escuta mudanças nas marcações
            dbRef.child("marks").on("value", function(snapshot) {
                const data = snapshot.val();
                if (data) {
                    appState.isSyncing = true;
                    appState.marks = data;
                    renderQuadras(); // Redesenha com novas marcações
                    appState.isSyncing = false;
                    updateSyncStatus('online', 'Sincronizado');
                } else {
                    updateSyncStatus('online', 'Sincronizado');
                }
            }, function(error) {
                console.error("Erro Firebase:", error);
                updateSyncStatus('offline', 'Erro de conexão');
            });
            
            // Monitora estado da conexão
            const connectedRef = database.ref(".info/connected");
            connectedRef.on("value", function(snap) {
                if (snap.val() === true) {
                    updateSyncStatus('online', 'Online');
                } else {
                    updateSyncStatus('offline', 'Offline');
                }
            });
        }
        
        // =====================================================
        // SALVAR ESTADO NO FIREBASE
        // =====================================================
        function saveState() {
            if (appState.isSyncing) return; // Evita loops
            
            dbRef.child("marks").set(appState.marks)
                .then(() => console.log("✅ Dados salvos no Firebase"))
                .catch(err => console.error("❌ Erro ao salvar:", err));
        }
        
        // =====================================================
        // CALCULAR CENTRO DE UM TERRITÓRIO
        // =====================================================
        function calculateTerritoryCenter(t) {
            const data = territoriesData[t];
            if (!data) return null;
            
            let sumLat = 0, sumLng = 0, count = 0;
            
            // Percorre todas as quadras do território
            data.quadras.forEach(quadra => {
                const qId = `T${t}_Q${quadra}`;
                const verts = quadVertices[qId];
                if (verts) {
                    verts.forEach(v => {
                        sumLat += v[0];
                        sumLng += v[1];
                        count++;
                    });
                }
            });
            
            if (count === 0) return null;
            
            // Retorna a média das coordenadas
            return [sumLat / count, sumLng / count];
        }
        
        // =====================================================
        // RENDERIZAR QUADRAS NO MAPA
        // =====================================================
        function renderQuadras() {
            // Limpa camada anterior
            if (appState.overlayGroup) {
                appState.overlayGroup.clearLayers();
            }
            
            // Mapa para evitar vértices duplicados
            const vertexMap = new Map(); // key: "lat,lng" -> {id, lat, lng, edges:[]}
            
            // Renderiza polígonos e arestas
            for (let t = 1; t <= 16; t++) {
                const data = territoriesData[t];
                if (!data) continue;
                
                // Obtém a cor do território
                const territoryColor = getTerritoryColor(t);
                
                data.quadras.forEach(quadra => {
                    const qId = `T${t}_Q${quadra}`;
                    const verts = quadVertices[qId];
                    if (!verts) return;
                    
                    // ===== POLÍGONO DA QUADRA (COM COR DO TERRITÓRIO) =====
                    const poly = L.polygon(verts, {
                        color: '#666',           // Cor da borda
                        fillColor: territoryColor, // Cor de preenchimento (do território)
                        fillOpacity: 0.4,        // Opacidade do preenchimento
                        weight: 1,               // Espessura da borda
                        className: 'quadra-polygon'
                    }).addTo(appState.overlayGroup);
                    
                    // Clique na quadra abre modal
                    poly.on('click', function(e) {
                        L.DomEvent.stopPropagation(e);
                        handleQuadraClick(qId, t, quadra);
                    });
                    
                    // ===== RÓTULO DA QUADRA (LETRA) =====
                    const center = poly.getBounds().getCenter();
                    const label = L.marker(center, {
                        icon: L.divIcon({
                            className: 'quadra-label-marker',
                            html: `<div class="quadra-label">${quadra}</div>`,
                            iconSize: [20, 10],
                            iconAnchor: [15, 10]
                        }),
                        interactive: false
                    }).addTo(appState.overlayGroup);
                    
                    // ===== ARESTAS =====
                    for (let i = 0; i < verts.length; i++) {
                        const j = (i + 1) % verts.length;
                        const v1 = verts[i];
                        const v2 = verts[j];
                        const edgeId = `${qId}_E${i}`;
                        const isMarked = appState.marks[edgeId] || false;
                        
                        // Linha da aresta
                        const edgeLine = L.polyline([v1, v2], {
                            color: isMarked ? '#38ef7d' : 'rgba(255,255,255,0.6)',
                            weight: isMarked ? 5 : 2.5,
                            opacity: isMarked ? 1 : 0.8,
                            className: isMarked ? 'edge marked' : 'edge'
                        }).addTo(appState.overlayGroup);
                        
                        edgeLine.on('click', function(e) {
                            L.DomEvent.stopPropagation(e);
                            handleEdgeClick(edgeId);
                        });
                        
                        // Área de toque maior (linha invisível)
                        const touchLine = L.polyline([v1, v2], {
                            color: 'transparent',
                            weight: 20,
                            opacity: 0
                        }).addTo(appState.overlayGroup);
                        
                        touchLine.on('click', function(e) {
                            L.DomEvent.stopPropagation(e);
                            handleEdgeClick(edgeId);
                        });
                        
                        // Coleta vértices para renderização posterior
                        const key1 = `${v1[0]},${v1[1]}`;
                        const prevEdgeId = `${qId}_E${(i - 1 + verts.length) % verts.length}`;
                        
                        if (!vertexMap.has(key1)) {
                            vertexMap.set(key1, {
                                id: `V_${key1}`,
                                lat: v1[0],
                                lng: v1[1],
                                edges: [edgeId, prevEdgeId]
                            });
                        } else {
                            const existing = vertexMap.get(key1);
                            if (!existing.edges.includes(edgeId)) existing.edges.push(edgeId);
                            if (!existing.edges.includes(prevEdgeId)) existing.edges.push(prevEdgeId);
                        }
                    }
                });
                
                // ===== NÚMERO DO TERRITÓRIO NO CENTRO =====
                const territoryCenter = calculateTerritoryCenter(t);
                if (territoryCenter) {
                    const numMarker = L.marker(territoryCenter, {
                        icon: L.divIcon({
                            className: 'territory-number-marker',
                            html: `<div class="territory-number">${t}</div>`,
                            iconSize: [40, 40],
                            iconAnchor: [20, 20]
                        }),
                        interactive: false
                    }).addTo(appState.overlayGroup);
                }
            }

            // ===== RENDERIZA VÉRTICES =====
            vertexMap.forEach(v => {
                const isSelected = appState.selectedVertex === v.id;
                const vertexColor = isSelected ? '#ffd700' : '#4facfe';
                const vertexRadius = isSelected ? 7 : 4;
                
                const circle = L.circleMarker([v.lat, v.lng], {
                    radius: vertexRadius,
                    fillColor: vertexColor,
                    color: '#fff',
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 1,
                    className: isSelected ? 'vertex selected' : 'vertex'
                }).addTo(appState.overlayGroup);
                
                // Guarda dados no elemento para referência
                circle.vertexId = v.id;
                circle.vertexEdges = v.edges;
                
                circle.on('click', function(e) {
                    L.DomEvent.stopPropagation(e);
                    handleVertexClick(v.id, v.edges);
                });
            });
        }
        
        // =====================================================
        // INTERAÇÕES
        // =====================================================
        
        // Clique em vértice
        function handleVertexClick(vertexId, edges) {
            if (appState.selectedVertex) {
                const prevVertex = appState.selectedVertex;
                
                // Se clicou no mesmo vértice, cancela seleção
                if (prevVertex === vertexId) {
                    appState.selectedVertex = null;
                    renderQuadras();
                    showStatus('Seleção cancelada');
                    return;
                }
                
                // Encontra vértice anterior e suas arestas
                let prevEdges = [];
                appState.overlayGroup.eachLayer(layer => {
                    if (layer.vertexId === prevVertex) {
                        prevEdges = layer.vertexEdges || [];
                    }
                });
                
                // Verifica se há aresta em comum
                const commonEdge = edges.find(e => prevEdges.includes(e));
                if (commonEdge) {
                    toggleEdge(commonEdge);
                    appState.selectedVertex = null;
                    renderQuadras();
                } else {
                    appState.selectedVertex = vertexId;
                    renderQuadras();
                    showStatus('Vértice selecionado. Toque em um <strong>vértice vizinho</strong>');
                }
            } else {
                appState.selectedVertex = vertexId;
                renderQuadras();
                showStatus('Vértice selecionado. Toque em um <strong>vértice vizinho</strong> para marcar a aresta');
            }
        }
        
        // Clique em aresta
        function handleEdgeClick(edgeId) {
            toggleEdge(edgeId);
            appState.selectedVertex = null;
            renderQuadras();
        }
        
        // Clique em quadra (abre modal)
        function handleQuadraClick(qId, tId, quadra) {
            const verts = quadVertices[qId];
            const numEdges = verts ? verts.length : 4;
            openModal(qId, tId, quadra, numEdges);
        }
        
        // Alterna marcação de aresta
        function toggleEdge(edgeId) {
            if (appState.marks[edgeId]) {
                delete appState.marks[edgeId];
            } else {
                appState.marks[edgeId] = true;
            }
            saveState();
            
            const parts = edgeId.split('_');
            const t = parts[0].replace('T', '');
            const q = parts[1].replace('Q', '');
            const e = parts[2];
            const action = appState.marks[edgeId] ? '✅ MARCADA' : '❌ DESMARCADA';
            
            showStatus(`Território ${t}, Quadra ${q}, Face ${e.replace('E', '')} <strong>${action}</strong>`);
        }
        
        // =====================================================
        // MODAL DE FACES
        // =====================================================
        function openModal(qId, tId, quadra, numEdges) {
            const modal = document.getElementById('modalOverlay');
            const title = document.getElementById('modalTitle');
            const subtitle = document.getElementById('modalSubtitle');
            const grid = document.getElementById('facesGrid');
            
            title.textContent = `Quadra ${quadra} - Território ${tId}`;
            subtitle.textContent = `Toque para marcar/desmarcar as ${numEdges} faces`;
            grid.innerHTML = '';
            
            const edgeNames = ['Topo', 'Lateral Direita', 'Base', 'Lateral Esquerda'];
            if (numEdges === 5) edgeNames.push('Extra');
            
            for (let i = 0; i < numEdges; i++) {
                const edgeId = `${qId}_E${i}`;
                const isMarked = appState.marks[edgeId] || false;
                
                const btn = document.createElement('button');
                btn.className = isMarked ? 'face-btn marked' : 'face-btn';
                btn.innerHTML = `
                    <span class="face-indicator"></span>
                    <span>Face ${i + 1}: ${edgeNames[i] || 'Face ' + (i + 1)}</span>
                `;
                btn.onclick = () => toggleEdgeFromModal(edgeId, btn);
                grid.appendChild(btn);
            }
            
            modal.classList.add('active');
        }
        
        function toggleEdgeFromModal(edgeId, btnElement) {
            if (appState.marks[edgeId]) {
                delete appState.marks[edgeId];
                btnElement.classList.remove('marked');
            } else {
                appState.marks[edgeId] = true;
                btnElement.classList.add('marked');
            }
            renderQuadras();
            saveState();
        }
        
        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }
        
        // Fecha modal ao clicar fora
        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
        
        // =====================================================
        // MARCAR/DESMARCAR TODAS AS ARESTAS DE UM TERRITÓRIO
        // =====================================================
        function getTerritoryNumber() {
            const input = document.getElementById('territoryInput');
            const value = parseInt(input.value, 10);
            if (!value || !territoriesData[value]) {
                showStatus('Digite um <strong>número de território válido</strong> (1 a 16)');
                input.focus();
                return null;
            }
            return value;
        }
        
        function getTerritoryEdgeIds(territoryNum) {
            const edgeIds = [];
            const data = territoriesData[territoryNum];
            data.quadras.forEach(quadra => {
                const qId = `T${territoryNum}_Q${quadra}`;
                const verts = quadVertices[qId];
                if (!verts) return;
                for (let i = 0; i < verts.length; i++) {
                    edgeIds.push(`${qId}_E${i}`);
                }
            });
            return edgeIds;
        }
        
        function markAllTerritoryEdges() {
            const territoryNum = getTerritoryNumber();
            if (!territoryNum) return;
            
            const edgeIds = getTerritoryEdgeIds(territoryNum);
            edgeIds.forEach(edgeId => {
                appState.marks[edgeId] = true;
            });
            
            appState.selectedVertex = null;
            saveState();
            renderQuadras();
            showStatus(`Território <strong>${territoryNum}</strong>: ${edgeIds.length} arestas <strong>marcadas</strong> ✓`);
        }
        
        function unmarkAllTerritoryEdges() {
            const territoryNum = getTerritoryNumber();
            if (!territoryNum) return;
            
            const edgeIds = getTerritoryEdgeIds(territoryNum);
            let removed = 0;
            edgeIds.forEach(edgeId => {
                if (appState.marks[edgeId]) {
                    delete appState.marks[edgeId];
                    removed++;
                }
            });
            
            appState.selectedVertex = null;
            saveState();
            renderQuadras();
            showStatus(`Território <strong>${territoryNum}</strong>: ${removed} arestas <strong>desmarcadas</strong> ✗`);
        }

        function mostrarTerritorioNaTela() {
            const num = parseInt(document.getElementById('territoryInput').value, 10);
            if (isNaN(num) || num < 1 || num > 16) {
                alert('Digite um número de território válido (1-16).');
                return;
            }
            
            const cfg = calibrations[num];
            if (cfg && appState.map) {
                appState.map.setView(cfg.center, cfg.zoom);
            } else {
                // Calcula bounding box automaticamente
                calcularPosicaoAutomatica(num);
            }
        }
        
        function calcularPosicaoAutomatica(num) {
            const data = territoriesData[num];
            if (!data || !appState.map) return;
            
            const bounds = L.latLngBounds();
            data.quadras.forEach(quadra => {
                const qId = `T${num}_Q${quadra}`;
                const verts = quadVertices[qId];
                if (verts) {
                    verts.forEach(v => bounds.extend(v));
                }
            });
            
            if (bounds.isValid()) {
                appState.map.fitBounds(bounds, { padding: [50, 50] });
            }
        }

        function changeTerritory(delta) {
            const input = document.getElementById('territoryInput');
            let value = parseInt(input.value, 10) || 0;
            value += delta;
            if (value < 1) value = 1;
            if (value > 16) value = 16;
            input.value = value;
            updateArrowButtons(value);
        }

        function validateTerritoryInput() {
            const input = document.getElementById('territoryInput');
            let value = parseInt(input.value, 10);
            if (isNaN(value)) {
                updateArrowButtons(null);
                return;
            }
            if (value < 1) { value = 1; input.value = 1; }
            if (value > 16) { value = 16; input.value = 16; }
            updateArrowButtons(value);
        }
        
        // ==============================
        // EXPORTAR DADOS
        function exportData() {
            const data = {
                exportDate: new Date().toISOString(),
                version: '8.0-osm',
                exportedBy: currentUser,
                marks: appState.marks,
                colors: {
                    1: COLORS.azulClaro,
                    2: COLORS.verdeClaro,
                    3: COLORS.rosa,
                    4: COLORS.marromClaro
                }
            };
            
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `territorios_${new Date().toISOString().slice(0, 10)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            showStatus('Exportado! 💾');
        }
        
        // =========================
        // FEEDBACK VISUAL
        let statusTimeout;
        function showStatus(text) {
            const panel = document.getElementById('statusPanel');
            const textEl = document.getElementById('statusText');
            textEl.innerHTML = text;
            panel.classList.add('visible');
            
            clearTimeout(statusTimeout);
            statusTimeout = setTimeout(() => {
                panel.classList.remove('visible');
            }, 4000);
        }
        
        function showLoading(text) {
            document.getElementById('loadingText').textContent = text;
            document.getElementById('loadingOverlay').classList.add('active');
        }
        
        function hideLoading() {
            document.getElementById('loadingOverlay').classList.remove('active');
        }
        
        function updateSyncStatus(status, text) {
            const el = document.getElementById('syncStatus');
            el.className = `sync-indicator ${status}`;
            el.textContent = text;
        }
        
        // =====================================================
        // INTERAÇÕES DO MAPA
        // =====================================================
        function setupMapInteractions() {
            // Fecha modal com Escape
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') closeModal();
                if (e.key === '+' || e.key === '=') zoomIn();
                if (e.key === '-' || e.key === '_') zoomOut();
                if (e.key === '0') resetView();
            });
            
            // Salva posição do mapa ao mover
            if (appState.map) {
                appState.map.on('moveend', function() {
                    try {
                        const center = appState.map.getCenter();
                        const zoom = appState.map.getZoom();
                        localStorage.setItem('mapCenter', JSON.stringify([center.lat, center.lng]));
                        localStorage.setItem('mapZoom', zoom);
                    } catch (e) { }
                });
            }
        }
        
        // =====================================================
        // RESTAURAR POSIÇÃO DO MAPA (localStorage)
        // =====================================================
        function restoreMapPosition() {
            try {
                const savedCenter = localStorage.getItem('mapCenter');
                const savedZoom = localStorage.getItem('mapZoom');
                if (savedCenter && savedZoom && appState.map) {
                    const center = JSON.parse(savedCenter);
                    appState.map.setView(center, parseInt(savedZoom));
                }
            } catch (e) { }
        }

        // =========================
        // INICIALIZA BOTÕES
        // =========================
        updateArrowButtons(null);
        
        function updateArrowButtons(currentValue) {
            // Função auxiliar para atualizar estado dos botões (se existirem)
            const btnDec = document.getElementById('btnDecrement');
            const btnInc = document.getElementById('btnIncrement');
            if (!btnDec || !btnInc) return;
            
            btnDec.disabled = (!currentValue || currentValue <= 1);
            btnInc.disabled = (currentValue >= 16);
        }
    </script>
</body>
</html>
