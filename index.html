<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sistema de Controle de Territórios v8.1 - OpenStreetMap</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Firebase v8 (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        /* ============================================
        RESET E BASE
        ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            overflow: hidden;
        }

        /* ============================================
        TELA DE LOGIN
        ============================================ */
        #loginScreen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            z-index: 10000;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        #loginScreen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 40px 35px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
        }

        .login-box h1 {
            font-size: 22px;
            color: #fff;
            margin-bottom: 8px;
        }

        .login-box .subtitle {
            font-size: 13px;
            color: #a0aec0;
            margin-bottom: 28px;
        }

        .login-icon {
            font-size: 56px;
            margin-bottom: 16px;
            display: block;
        }

        .login-input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 14px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.25);
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .login-input::placeholder {
            color: #8892b0;
        }

        .login-input:focus {
            border-color: #4facfe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.2);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(79, 172, 254, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-error {
            color: #ff6b6b;
            font-size: 13px;
            margin-top: 12px;
            min-height: 18px;
        }

        /* ============================================
        APP PRINCIPAL
        ============================================ */
        #appContainer {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
        }

        #appContainer.active {
            display: flex;
        }

        /* Barra superior */
        .top-bar {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 16px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            z-index: 1000;
            flex-shrink: 0;
        }

        .top-bar-header {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 200px;
        }

        .top-bar-header h1 {
            font-size: 16px;
            color: #fff;
            white-space: nowrap;
        }

        .user-badge {
            background: rgba(79, 172, 254, 0.2);
            color: #4facfe;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        /* Controles */
        .controls {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.08);
            color: #e0e0e0;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .btn-zoom {
            padding: 8px 10px;
            font-size: 14px;
        }

        .btn-blue {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            border: none;
            color: #fff;
        }

        .btn-blue:hover {
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
        }

        .btn-mark-all {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            border: none;
            color: #fff;
        }

        .btn-unmark-all {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            border: none;
            color: #fff;
        }

        .btn-reset {
            background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
            border: none;
            color: #fff;
        }

        /* Controles de território */
        .territory-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .territory-controls label {
            font-size: 14px;
            color: #1865c9;
            white-space: nowrap;
        }

        .territory-input-wrapper {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-arrow {
            width: 32px;
            height: 32px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.08);
            color: #e0e0e0;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-arrow:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-arrow:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .territory-input {
            width: 56px;
            height: 32px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            outline: none;
        }

        .territory-input:focus {
            border-color: #4facfe;
            box-shadow: 0 0 0 2px rgba(79, 172, 254, 0.2);
        }

        .btn-action {
            padding: 7px 14px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        /* Mapa Leaflet */
        #map {
            flex: 1;
            width: 100%;
            min-height: 0;
            background: #1a1a2e;
        }

        /* Customização do Leaflet */
        .leaflet-container {
            background: #1a1a2e !important;
        }

        /* ============================================
        OVERLAY SVG SOBRE O MAPA (via Leaflet)
        ============================================ */
        .quadra-poly {
            fill: rgba(79, 172, 254, 0.08);
            stroke: rgba(79, 172, 254, 0.3);
            stroke-width: 1;
            cursor: pointer;
            transition: fill 0.2s;
        }

        .quadra-poly:hover {
            fill: rgba(79, 172, 254, 0.18);
        }

        .quadra-label {
            font-size: 15px;
            font-weight: 800;
            fill: rgba(35, 7, 197, 0.85);
            text-anchor: middle;
            dominant-baseline: middle;
            pointer-events: none;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        }

        .edge-guide {
            stroke: rgba(255, 255, 255, 0.15);
            stroke-width: 8;
            fill: none;
            pointer-events: stroke;
            cursor: pointer;
        }

        .edge {
            stroke: rgba(255, 255, 255, 0.5);
            stroke-width: 2.5;
            fill: none;
            pointer-events: stroke;
            cursor: pointer;
            transition: stroke 0.2s, stroke-width 0.2s;
        }

        .edge:hover {
            stroke: #4facfe;
            stroke-width: 4;
        }

        .edge.marked {
            stroke: #38ef7d;
            stroke-width: 4;
            filter: drop-shadow(0 0 4px rgba(56, 239, 125, 0.6));
        }

        .vertex {
            fill: #4facfe;
            stroke: #fff;
            stroke-width: 2;
            cursor: pointer;
            transition: all 0.2s;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
        }

        .vertex:hover {
            fill: #fff;
            stroke: #4facfe;
            r: 10;
        }

        .vertex.selected {
            fill: #ffd700;
            stroke: #fff;
            r: 10;
            filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.8));
        }

        .vertex.pending {
            fill: #ff6b6b;
            stroke: #fff;
            r: 10;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        /* ============================================
        PAINEL DE STATUS
        ============================================ */
        .status-panel {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            padding: 12px 24px;
            font-size: 14px;
            color: #e0e0e0;
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
        }

        .status-panel.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .status-panel strong {
            color: #4facfe;
        }

        /* ============================================
   MODAL DE FACES
   ============================================ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 24px;
            width: 90%;
            max-width: 420px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            transform: scale(0.9);
            transition: transform 0.3s;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-title {
            font-size: 18px;
            color: #fff;
            margin: 0;
        }

        .modal-subtitle {
            font-size: 13px;
            color: #a0aec0;
            margin-top: 4px;
        }

        .modal-close {
            background: none;
            border: none;
            color: #a0aec0;
            font-size: 28px;
            line-height: 1;
            cursor: pointer;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .faces-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .face-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: #e0e0e0;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }

        .face-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .face-btn.marked {
            background: rgba(17, 153, 142, 0.2);
            border-color: #11998e;
            color: #38ef7d;
        }

        .face-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            flex-shrink: 0;
            transition: background 0.2s;
        }

        .face-btn.marked .face-indicator {
            background: #38ef7d;
            box-shadow: 0 0 6px rgba(56, 239, 125, 0.6);
        }

        /* ============================================
   RESPONSIVO
   ============================================ */
        @media (max-width: 768px) {
            .top-bar {
                padding: 8px 10px;
                gap: 6px;
            }

            .top-bar-header h1 {
                font-size: 14px;
            }

            .btn {
                padding: 6px 10px;
                font-size: 12px;
            }

            .territory-controls label {
                font-size: 12px;
            }

            .modal-content {
                padding: 16px;
                max-width: 320px;
            }

            .faces-grid {
                grid-template-columns: 1fr;
            }

            .face-btn {
                padding: 10px 12px;
                font-size: 13px;
            }

            .vertex {
                r: 6;
            }

            .vertex:hover,
            .vertex.selected,
            .vertex.pending {
                r: 8;
            }
        }

        /* Loading overlay */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s;
        }

        .loading-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #4facfe;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            margin-top: 16px;
            color: #a0aec0;
            font-size: 14px;
        }

        /* Sync indicator */
        .sync-indicator {
            position: fixed;
            top: 70px;
            right: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
            z-index: 2000;
            transition: all 0.3s;
        }

        .sync-indicator.online {
            background: rgba(17, 153, 142, 0.2);
            color: #38ef7d;
            border: 1px solid rgba(17, 153, 142, 0.3);
        }

        .sync-indicator.offline {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
            border: 1px solid rgba(255, 107, 107, 0.3);
        }

        .sync-indicator.syncing {
            background: rgba(79, 172, 254, 0.2);
            color: #4facfe;
            border: 1px solid rgba(79, 172, 254, 0.3);
        }
    </style>

</head>

                    <div>
                        <h2 class="modal-title" id="modalTitle">Quadra E - Território 1</h2>
                        <div class="modal-subtitle" id="modalSubtitle">Gerenciamento de faces</div>
                    </div>
                    <button class="modal-close" onclick="closeModal()">&times;</button>
                </div>
                <div class="faces-grid" id="facesGrid"></div>
            </div>
        </div>

        <!-- Loading -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-spinner"></div>
            <div class="loading-text" id="loadingText">Carregando mapa...</div>

            // Adiciona controle de zoom customizado (direita)

            // Cria camada SVG para overlays
            appState.overlayGroup = L.layerGroup().addTo(appState.map);

            // Renderiza os polígonos das quadras

            // Configura listener do Firebase
            setupFirebaseListener();

            // Configura cliques no mapa
            setupMapInteractions();

            const connectedRef = database.ref(".info/connected");

                if (snap.val() === true) {
                    updateSyncStatus('online', 'Online');
                } else {
                    updateSyncStatus('offline', 'Offline');
                }
            });
        }

        function updateSyncStatus(status, text) {
            const indicator = document.getElementById('syncIndicator');
            const dot = document.getElementById('syncDot');
            const txt = document.getElementById('syncText');

            indicator.className = 'sync-indicator ' + status;
            txt.textContent = text;

            if (status === 'online') dot.textContent = '●';
            else if (status === 'offline') dot.textContent = '○';
            else dot.textContent = '◐';
        }

        // ═══════════════════════════════════════════════════════════════════
        // SALVAR ESTADO (Firebase + localStorage backup)
        // ═══════════════════════════════════════════════════════════════════
        function saveState() {
            // Salva zoom/pan no localStorage (pessoal)
            try {
                if (appState.map) {
                    const center = appState.map.getCenter();
                    const zoom = appState.map.getZoom();
                    localStorage.setItem('mapCenter', JSON.stringify([center.lat, center.lng]));
                    localStorage.setItem('mapZoom', zoom);
                }
            } catch (e) {
                console.warn('Erro ao salvar local:', e);
            }

            // Salva marcações no Firebase (compartilhado)
            //if (!appState.isSyncing) {
            if (!appState.isSyncing && dbRef) {
                updateSyncStatus('syncing', 'Salvando...');
                dbRef.child("marks").set(appState.marks)
                    .then(() => {
                        console.log("✅ Dados salvos na nuvem!");
                        updateSyncStatus('online', 'Sincronizado');
                    })
                    .catch((error) => {
                        console.error("❌ Erro ao salvar:", error);
                        updateSyncStatus('offline', 'Falha ao salvar');
                    });
            }
        }

        // ═══════════════════════════════════════════════════════════════════
        // RENDERIZAR QUADRAS NO MAPA (Leaflet SVG)
        // ═══════════════════════════════════════════════════════════════════
        function renderQuadras() {
            // Limpa camada anterior
            if (appState.overlayGroup) {
                appState.overlayGroup.clearLayers();
            }

            // Mapa para evitar vértices duplicados
            const vertexMap = new Map(); // key: "lat,lng" -> {id, lat, lng, edges: []}

            // Renderiza polígonos e arestas
            for (let t = 1; t <= 16; t++) {
                const data = territoriesData[t];
                if (!data) continue;

                data.quadras.forEach(quadra => {
                    const qId = `T${t}_Q${quadra}`;
                    const verts = quadVertices[qId];
                    if (!verts) return;

                    // Polígono da quadra
                    const poly = L.polygon(verts, {
                        color: data.color.replace('0.2', '0.4'),
                        fillColor: data.color,
                        fillOpacity: 0.3,
                        weight: 1,
                        className: 'quadra-poly'
                    }).addTo(appState.overlayGroup);

                    // Clique na quadra abre modal
                    poly.on('click', function (e) {
                        L.DomEvent.stopPropagation(e);
                        handleQuadraClick(qId, t, quadra);
                    });

                    // Label no centro
                    const center = poly.getBounds().getCenter();
                    const label = L.marker(center, {
                        icon: L.divIcon({
                            className: 'quadra-label-marker',
                            html: `<span class="quadra-label">${quadra}</span>`,
                            iconSize: [30, 20],
                            iconAnchor: [15, 10]
                        }),
                        interactive: false
                    }).addTo(appState.overlayGroup);

                    // Arestas
                    for (let i = 0; i < verts.length; i++) {
                        const j = (i + 1) % verts.length;
                        const v1 = verts[i];
                        const v2 = verts[j];
                        const edgeId = `${qId}_E${i}`;
                        const isMarked = appState.marks[edgeId] || false;

                        // Linha da aresta
                        const edgeLine = L.polyline([v1, v2], {
                            color: isMarked ? '#38ef7d' : 'rgba(255,255,255,0.6)',
                            weight: isMarked ? 5 : 2.5,
                            opacity: isMarked ? 1 : 0.8,
                            className: isMarked ? 'edge marked' : 'edge'
                        }).addTo(appState.overlayGroup);

                        edgeLine.on('click', function (e) {
                            L.DomEvent.stopPropagation(e);
                            handleEdgeClick(edgeId);
                        });

                        // Área de toque maior (linha invisível)
                        const touchLine = L.polyline([v1, v2], {
                            color: 'transparent',
                            weight: 20,
                            opacity: 0
                        }).addTo(appState.overlayGroup);
                        touchLine.on('click', function (e) {
                            L.DomEvent.stopPropagation(e);
                            handleEdgeClick(edgeId);
                        });

                        // Coleta vértices
                        const key1 = `${v1[0]},${v1[1]}`;
                        const prevEdgeId = `${qId}_E${(i - 1 + verts.length) % verts.length}`;

                        if (!vertexMap.has(key1)) {
                            vertexMap.set(key1, {
                                id: `V_${key1}`,
                                lat: v1[0],
                                lng: v1[1],
                                edges: [edgeId, prevEdgeId]
                            });
                        } else {
                            const existing = vertexMap.get(key1);
                            if (!existing.edges.includes(edgeId)) existing.edges.push(edgeId);
                            if (!existing.edges.includes(prevEdgeId)) existing.edges.push(prevEdgeId);
                        }
                    }
                });
            }

            // Renderiza vértices
            vertexMap.forEach(v => {
                const isSelected = appState.selectedVertex === v.id;
                const vertexColor = isSelected ? '#ffd700' : '#4facfe';
                const vertexRadius = isSelected ? 10 : 7;

                const circle = L.circleMarker([v.lat, v.lng], {
                    radius: vertexRadius,
                    fillColor: vertexColor,
                    color: '#fff',
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 1,
                    className: isSelected ? 'vertex selected' : 'vertex'
                }).addTo(appState.overlayGroup);

                // Guarda dados no elemento para referência
                circle.vertexId = v.id;
                circle.vertexEdges = v.edges;

                circle.on('click', function (e) {
                    L.DomEvent.stopPropagation(e);
                    handleVertexClick(v.id, v.edges);
                });
            });
        }

        // ═══════════════════════════════════════════════════════════════════
        // INTERAÇÕES
        // ═══════════════════════════════════════════════════════════════════
        function handleVertexClick(vertexId, edges) {
            if (appState.selectedVertex) {
                const prevVertex = appState.selectedVertex;

                if (prevVertex === vertexId) {
                    appState.selectedVertex = null;
                    renderQuadras();
                    showStatus('Seleção cancelada');
                    return;
                }

                // Encontra vértice anterior e suas arestas
                let prevEdges = [];
                appState.overlayGroup.eachLayer(layer => {
                    if (layer.vertexId === prevVertex) {
                        prevEdges = layer.vertexEdges || [];
                    }
                });

                const commonEdge = edges.find(e => prevEdges.includes(e));
                if (commonEdge) {
                    toggleEdge(commonEdge);
                    appState.selectedVertex = null;
                    renderQuadras();
                } else {
                    appState.selectedVertex = vertexId;
                    renderQuadras();
                    showStatus('Vértice selecionado. Toque em um <strong>vértice vizinho</strong>');
                }
            } else {
                appState.selectedVertex = vertexId;
                renderQuadras();
                showStatus('Vértice selecionado. Toque em um <strong>vértice vizinho</strong> para marcar a aresta');
            }
        }

        function handleEdgeClick(edgeId) {
            toggleEdge(edgeId);
            appState.selectedVertex = null;
            renderQuadras();
        }

        function handleQuadraClick(qId, tId, quadra) {
            const verts = quadVertices[qId];
            const numEdges = verts ? verts.length : 4;
            openModal(qId, tId, quadra, numEdges);
        }

        function toggleEdge(edgeId) {
            if (appState.marks[edgeId]) {
                delete appState.marks[edgeId];
            } else {
                appState.marks[edgeId] = true;
            }
            saveState();

            const parts = edgeId.split('_');
            const t = parts[0].replace('T', '');
            const q = parts[1].replace('Q', '');
            const e = parts[2];
            const action = appState.marks[edgeId] ? '✅ MARCADA' : '❌ DESMARCADA';
            showStatus(`Território ${t}, Quadra ${q}, Face ${e.replace('E', '')} <strong>${action}</strong>`);
        }

        // ═══════════════════════════════════════════════════════════════════
        // MODAL DE FACES
        // ═══════════════════════════════════════════════════════════════════
        function openModal(qId, tId, quadra, numEdges) {
            const modal = document.getElementById('modalOverlay');
            const title = document.getElementById('modalTitle');
            const subtitle = document.getElementById('modalSubtitle');
            const grid = document.getElementById('facesGrid');

            title.textContent = `Quadra ${quadra} - Território ${tId}`;
            subtitle.textContent = `Toque para marcar/desmarcar as ${numEdges} faces`;
            grid.innerHTML = '';

            const edgeNames = ['Topo', 'Lateral Direita', 'Base', 'Lateral Esquerda'];
            if (numEdges === 5) edgeNames.push('Divisão');

            for (let i = 0; i < numEdges; i++) {
                const edgeId = `${qId}_E${i}`;
                const isMarked = appState.marks[edgeId] || false;

                const btn = document.createElement('button');
                btn.className = isMarked ? 'face-btn marked' : 'face-btn';
                btn.innerHTML = `
      <span class="face-indicator"></span>
      <span>Face ${i + 1}: ${edgeNames[i] || 'Face ' + (i + 1)}</span>
    `;
                btn.onclick = () => toggleEdgeFromModal(edgeId, btn);
                grid.appendChild(btn);
            }

            modal.classList.add('active');
        }

        function toggleEdgeFromModal(edgeId, btnElement) {
            if (appState.marks[edgeId]) {
                delete appState.marks[edgeId];
                btnElement.classList.remove('marked');
            } else {
                appState.marks[edgeId] = true;
                btnElement.classList.add('marked');
            }
            renderQuadras();
            saveState();
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        document.getElementById('modalOverlay').addEventListener('click', function (e) {
            if (e.target === this) closeModal();
        });

        // ═══════════════════════════════════════════════════════════════════
        // MARCAR / DESMARCAR TODAS DE UM TERRITÓRIO
        // ═══════════════════════════════════════════════════════════════════
        function getTerritoryNumber() {
            const input = document.getElementById('territoryInput');
            const value = parseInt(input.value, 10);
            if (!value || !territoriesData[value]) {
                showStatus('Digite um <strong>número de território válido</strong> (1 a 16)');
                input.focus();
                return null;
            }
            return value;
        }

        function getTerritoryEdgeIds(territoryNum) {
            const edgeIds = [];
            const data = territoriesData[territoryNum];
            data.quadras.forEach(quadra => {
                const qId = `T${territoryNum}_Q${quadra}`;
                const verts = quadVertices[qId];
                if (!verts) return;
                for (let i = 0; i < verts.length; i++) {
                    edgeIds.push(`${qId}_E${i}`);
                }
            });
            return edgeIds;
        }

        function markAllTerritoryEdges() {
            const territoryNum = getTerritoryNumber();
            if (!territoryNum) return;

            const edgeIds = getTerritoryEdgeIds(territoryNum);
            edgeIds.forEach(edgeId => {
                appState.marks[edgeId] = true;
            });
            appState.selectedVertex = null;
            saveState();
            renderQuadras();
            showStatus(`Território <strong>${territoryNum}</strong>: ${edgeIds.length} arestas <strong>marcadas</strong> ✅`);
        }

        function unmarkAllTerritoryEdges() {
            const territoryNum = getTerritoryNumber();
            if (!territoryNum) return;

            const edgeIds = getTerritoryEdgeIds(territoryNum);
            let removed = 0;
            edgeIds.forEach(edgeId => {
                if (appState.marks[edgeId]) {
                    delete appState.marks[edgeId];
                    removed++;
                }
            });
            appState.selectedVertex = null;
            saveState();
            renderQuadras();
            showStatus(`Território <strong>${territoryNum}</strong>: ${removed} arestas <strong>desmarcadas</strong> ❌`);
        }

        function zoomIn() {
            if (appState.map) appState.map.zoomIn();
        }
        function zoomOut() {
            if (appState.map) appState.map.zoomOut();
        }
        function resetView() {
            if (appState.map) {
                appState.map.setView(MAP_CENTER, MAP_ZOOM);
            }
        }

        // MOSTRAR TERRITÓRIO NA TELA
        // ═══════════════════════════════════════════════════════════════════
        const calibrations = {
            "1": { center: [-23.541000, -46.509000], zoom: 17 },
            "2": { center: [-23.542500, -46.511000], zoom: 17 },
            "3": { center: [-23.544000, -46.512000], zoom: 17 },
            // Adicione calibrações para os demais territórios
        };

        function mostrarTerritorioNaTela() {
            const num = parseInt(document.getElementById('territoryInput').value, 10);
            if (isNaN(num) || num < 1 || num > 16) {
                alert('Digite um número de território válido (1-16).');
                return;
            }

            const cfg = calibrations[num];
            if (cfg && appState.map) {
                appState.map.setView(cfg.center, cfg.zoom);
            } else {
                // Calcula bounding box automaticamente
                calcularPosicaoAutomatica(num);
            }
        }

        function calcularPosicaoAutomatica(num) {
            const data = territoriesData[num];
            if (!data || !appState.map) return;

            const bounds = L.latLngBounds();
            data.quadras.forEach(quadra => {
                const qId = `T${num}_Q${quadra}`;
                const verts = quadVertices[qId];
                if (verts) {
                    verts.forEach(v => bounds.extend(v));
                }
            });

            if (bounds.isValid()) {
                appState.map.fitBounds(bounds, { padding: [50, 50] });
            }
        }

        function changeTerritory(delta) {
            const input = document.getElementById('territoryInput');
            let value = parseInt(input.value, 10) || 0;
            value += delta;
            if (value < 1) value = 1;
            if (value > 16) value = 16;
            input.value = value;
            updateArrowButtons(value);
        }

        function validateTerritoryInput() {
            const input = document.getElementById('territoryInput');
            let value = parseInt(input.value, 10);
            if (isNaN(value)) {
                updateArrowButtons(null);
                return;
            }
            if (value < 1) { value = 1; input.value = 1; }
            if (value > 16) { value = 16; input.value = 16; }
            updateArrowButtons(value);
        }

        function updateArrowButtons(currentValue) {
            const btnDec = document.getElementById('btnDecrement');
            const btnInc = document.getElementById('btnIncrement');
            if (!btnDec || !btnInc) return;
            btnDec.disabled = (!currentValue || currentValue <= 1);
            btnInc.disabled = (currentValue >= 16);
        }

        function exportData() {
            const data = {
                exportDate: new Date().toISOString(),
                version: '8.0-osm',
                exportedBy: currentUser,
                marks: appState.marks
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `territorios_${new Date().toISOString().slice(0, 10)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showStatus('Exportado! 💾');
        }

        // ═══════════════════════════════════════════════════════════════════
        // FEEDBACK VISUAL
        // ═══════════════════════════════════════════════════════════════════
        let statusTimeout;
        function showStatus(text) {
            const panel = document.getElementById('statusPanel');
            const textEl = document.getElementById('statusText');
            textEl.innerHTML = text;
            panel.classList.add('visible');
            clearTimeout(statusTimeout);
            statusTimeout = setTimeout(() => {
                panel.classList.remove('visible');
            }, 4000);
        }

        function showLoading(text) {
            document.getElementById('loadingText').textContent = text;
            document.getElementById('loadingOverlay').classList.add('active');
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').classList.remove('active');
        }

        // ═══════════════════════════════════════════════════════════════════
        // INTERAÇÕES DO MAPA
        // ═══════════════════════════════════════════════════════════════════
        function setupMapInteractions() {
            // Fecha modal com Escape
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') closeModal();
                if (e.key === '+' || e.key === '=') zoomIn();
                if (e.key === '-' || e.key === '_') zoomOut();
                if (e.key === '0') resetView();
            });

            // Salva posição do mapa ao mover
            if (appState.map) {
                appState.map.on('moveend', function () {
                    try {
                        const center = appState.map.getCenter();
                        const zoom = appState.map.getZoom();
                        localStorage.setItem('mapCenter', JSON.stringify([center.lat, center.lng]));
                        localStorage.setItem('mapZoom', zoom);
                    } catch (e) { }
                });
            }
        }

        // ═══════════════════════════════════════════════════════════════════
        // RESTAURAR POSIÇÃO DO MAPA (localStorage)
        // ═══════════════════════════════════════════════════════════════════
        function restoreMapPosition() {
            try {
                const savedCenter = localStorage.getItem('mapCenter');
                const savedZoom = localStorage.getItem('mapZoom');
                if (savedCenter && savedZoom && appState.map) {
                    const center = JSON.parse(savedCenter);
                    appState.map.setView(center, parseInt(savedZoom));
                }
            } catch (e) { }
        }

        // Inicializa botões
        updateArrowButtons(null);
    </script>
